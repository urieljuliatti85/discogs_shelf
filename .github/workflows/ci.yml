name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

# Vulnerability scanning lives in security.yml, on its own schedule.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: RuboCop
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      # -f github turns offenses into inline annotations on the PR diff.
      - name: Lint Ruby
        run: bin/rubocop -f github

  build:
    name: Frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci

      # app/assets/builds is gitignored, so a broken esbuild or Tailwind build
      # only shows up when something actually compiles it.
      - name: Bundle JavaScript
        run: npm run build

      - name: Compile CSS
        run: npm run build:css

  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RAILS_ENV: test
      COVERAGE: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      # Node is not optional here: with no `test:prepare` task defined (the
      # test_unit railtie is commented out in config/application.rb),
      # jsbundling-rails and cssbundling-rails enhance `db:test:prepare` with
      # javascript:build and css:build instead, so preparing the test DB shells
      # out to esbuild and tailwindcss.
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci

      - name: Prepare test database
        run: bin/rails db:test:prepare

      - name: Run tests
        run: bin/rails test

      # SimpleCov only instruments when COVERAGE is set (see test/test_helper.rb),
      # so a local `bin/rails test` stays fast by default.
      - name: Publish coverage summary
        if: always()
        run: |
          if [ -f coverage/.last_run.json ]; then
            pct=$(ruby -rjson -e 'puts JSON.load(File.read("coverage/.last_run.json"))["result"]["line"]')
            echo "### Line coverage: ${pct}%" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14
